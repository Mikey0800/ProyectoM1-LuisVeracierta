<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Colorfly Studio</title>
</head>

<body>
    <header>
        <h1 id="titulo">Colorfly Studio</h1>
        <h2 id="subtitulo">Inspiración instantánea. Flujo creativo sin pausas.</h2>
        <p class="descripcion">La herramienta oficial de Colorfly Studio para generar, estandarizar y exportar paletas
            de color en segundos.
            Diseñada para agilizar nuestras propuestas visuales de principio a fin.</p>
    </header>
    <main>
        <main>
            <!-- Sección de controles para elegir la cantidad de colores -->
            <section class="controles">
                <h2>Genera tu combinación</h2>
                <button class="btn6">6 Colores</button>
                <button class="btn8">8 Colores</button>
                <button class="btn9">9 Colores</button>
                <button class="btngenerar">Generar paleta</button>
            </section>

            <!-- Contenedor donde se mostrarán los bloques de color -->
            <section class="paleta">
                <div class="bloque-color"></div>
                <div class="bloque-color"></div>
                <div class="bloque-color"></div>
                <div class="bloque-color"></div>
                <div class="bloque-color"></div>
                <div class="bloque-color"></div>
            </section>
        </main>
    </main>
</body>

</html>
